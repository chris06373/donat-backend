<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donut House - Online Ordering</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff8f3;
    color: #382b27;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1100px;
    margin: auto;
    min-height: 100vh;
    background: white;
    box-shadow: 0 0 25px #00000008;
    position: relative;
}

/* HEADER */

.header {
    background: #8d4935;
    color: white;
    padding: 20px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo small {
    display: block;
    font-size: 11px;
    font-weight: normal;
    margin-top: 4px;
    opacity: 0.9;
}

.cart-button {
    background: white;
    color: #8d4935;
    border: none;
    padding: 10px 15px;
    border-radius: 25px;
    font-weight: bold;
    white-space: nowrap;
}

/* NAVIGATION */

.nav {
    display: flex;
    padding: 12px;
    gap: 8px;
    border-bottom: 1px solid #eee;
    overflow-x: auto;
    position: sticky;
    top: 0;
    background: white;
    z-index: 15;
}

.nav button {
    border: none;
    background: #f8eee8;
    padding: 10px 16px;
    border-radius: 20px;
    white-space: nowrap;
    color: #75574d;
}

.nav button.active {
    background: #8d4935;
    color: white;
}

/* CONTENT */

.content {
    padding: 24px;
    min-height: 650px;
    padding-bottom: 90px;
}

.page-title {
    font-size: 23px;
    margin-bottom: 6px;
}

.subtitle {
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2b1e1a;
    color: white;
    padding: 11px 18px;
    border-radius: 25px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 50;
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* PRODUCT */

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.product {
    border: 1px solid #f0e7e2;
    border-radius: 13px;
    overflow: hidden;
    background: white;
    display: flex;
    flex-direction: column;
}

.product img {
    width: 100%;
    height: 155px;
    object-fit: cover;
    background: #f8eee8;
}

.product-info {
    padding: 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.product h3 {
    font-size: 15px;
    margin-bottom: 6px;
}

.product p {
    font-size: 12px;
    color: #888;
    min-height: 30px;
}

.stock-badge {
    font-size: 11px;
    color: #15803d;
    background: #dcfce7;
    padding: 4px 8px;
    border-radius: 12px;
    display: inline-block;
    margin-top: 8px;
    width: fit-content;
}

.stock-badge.low {
    color: #9a6700;
    background: #fff1cc;
}

.stock-badge.out {
    color: #b91c1c;
    background: #fee2e2;
}

.price {
    color: #a0523b;
    font-weight: bold;
    margin: 10px 0 12px;
    margin-top: auto;
}

.btn {
    border: none;
    background: #8d4935;
    color: white;
    padding: 11px;
    border-radius: 7px;
    width: 100%;
    font-weight: bold;
}

.btn:hover:not(:disabled) {
    background: #713725;
}

.btn:disabled {
    background: #d6c7c2;
    cursor: not-allowed;
}

.btn-secondary {
    background: #777;
}

.btn-success {
    background: #16834a;
}

.btn-wa {
    background: #128c7e;
}

.card-qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.card-qty-row button {
    border: none;
    background: #f4e6df;
    color: #382b27;
    padding: 9px 14px;
    border-radius: 7px;
    font-weight: bold;
}

.card-qty-row span {
    font-weight: bold;
    font-size: 14px;
}

/* MOBILE STICKY CART BAR */

.mobile-cart-bar {
    display: none;
}

/* FORM */

.panel {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline-color: #a0523b;
    background: white;
}

/* CART */

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.cart-item small {
    color: #888;
}

.qty {
    display: flex;
    align-items: center;
    gap: 8px;
}

.qty button {
    border: none;
    background: #f4e6df;
    padding: 6px 11px;
    border-radius: 6px;
    font-weight: bold;
}

.remove {
    background: #ffe9e9 !important;
    color: #c33;
}

.total {
    padding: 12px 0;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 16px;
}

/* HISTORY */

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 17px;
}

.toolbar input,
.toolbar select {
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 7px;
    min-width: 0;
}

.toolbar input {
    flex: 1;
}

.table-wrap {
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 650px;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 13px;
}

th {
    background: #faf4f0;
}

.status {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 11px;
    white-space: nowrap;
}

.Pending {
    background: #fff1cc;
    color: #9a6700;
}

.Diproses {
    background: #e3edff;
    color: #2457a6;
}

.Selesai {
    background: #dcfce7;
    color: #15803d;
}

.Dibatalkan {
    background: #fee2e2;
    color: #b91c1c;
}

.pagination {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.pagination button {
    border: 1px solid #ddd;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
}

.pagination button.active {
    background: #8d4935;
    color: white;
}

.empty {
    text-align: center;
    padding: 35px;
    color: #999;
}

/* INVOICE */

.invoice {
    max-width: 850px;
    margin: auto;
    border: 1px solid #eee;
    border-radius: 16px;
    overflow: hidden;
    background: white;
}

.invoice-header {
    background: #8d4935;
    color: white;
    padding: 28px;
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.invoice-header h2 {
    font-size: 24px;
    margin-bottom: 6px;
}

.invoice-header p {
    font-size: 12px;
    opacity: .88;
    margin-top: 4px;
}

.invoice-body {
    padding: 28px;
}

.invoice-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 26px;
}

.invoice-info small {
    display: block;
    color: #999;
    margin-bottom: 6px;
}

.invoice-info b {
    font-size: 14px;
}

.invoice-info p {
    font-size: 13px;
    margin-top: 6px;
    color: #777;
}

.invoice-table {
    width: 100%;
    min-width: 0;
    margin: 18px 0;
}

.invoice-table th {
    background: #faf4f0;
    color: #75574d;
}

.invoice-table td,
.invoice-table th {
    padding: 13px 10px;
}

.invoice-summary {
    max-width: 320px;
    margin-left: auto;
    padding-top: 12px;
}

.invoice-summary div {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 14px;
}

.invoice-summary .grand {
    border-top: 2px solid #8d4935;
    margin-top: 8px;
    padding-top: 14px;
    font-size: 18px;
    font-weight: bold;
    color: #8d4935;
}

.invoice-footer {
    background: #faf4f0;
    padding: 20px 28px;
    text-align: center;
    color: #8d4935;
    font-size: 13px;
}

.invoice-footer p {
    margin-top: 5px;
}

.invoice-actions {
    display: flex;
    gap: 10px;
    margin: 18px auto;
    max-width: 850px;
}

.invoice-actions button {
    flex: 1;
}

.pickup-notice {
    margin-top: 22px;
    padding: 16px;
    background: #fff8e8;
    border-radius: 10px;
}

.pickup-notice p {
    font-size: 13px;
    color: #777;
    margin: 6px 0 12px;
}

/* MOBILE */

@media(max-width: 700px) {
    .header {
        padding: 16px;
    }

    .cart-button {
        display: none;
    }

    .content {
        padding: 16px;
        padding-bottom: 100px;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 11px;
    }

    .product img {
        height: 120px;
    }

    .product-info {
        padding: 10px;
    }

    .product h3 {
        font-size: 13px;
    }

    .product p {
        font-size: 11px;
    }

    .product .btn {
        font-size: 12px;
        padding: 9px;
    }

    .toolbar {
        flex-direction: column;
    }

    .invoice-header,
    .invoice-body {
        padding: 18px;
    }

    .invoice-header {
        flex-direction: column;
    }

    .invoice-header h2 {
        font-size: 19px;
    }

    .invoice-info {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .invoice-actions {
        flex-direction: column;
    }

    .invoice-table td,
    .invoice-table th {
        padding: 10px 6px;
        font-size: 11px;
    }

    .mobile-cart-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #8d4935;
        color: white;
        padding: 12px 16px;
        z-index: 20;
        box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
    }

    .mobile-cart-bar button {
        background: white;
        color: #8d4935;
        border: none;
        padding: 8px 14px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 13px;
    }
}

@media(max-width: 360px) {
    .products {
        grid-template-columns: 1fr;
    }
}

/* PRINT */

@media print {
    @page {
        size: A4;
        margin: 12mm;
    }

    body {
        background: white !important;
    }

    .header,
    .nav,
    .invoice-actions,
    .mobile-cart-bar,
    .toast {
        display: none !important;
    }

    .app {
        max-width: none;
        box-shadow: none;
    }

    .content {
        padding: 0;
        min-height: auto;
    }

    .invoice {
        border: none;
        border-radius: 0;
        max-width: none;
    }

    .invoice-header,
    .invoice-footer,
    .invoice-table th {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .pickup-notice {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            🍩 DONUT HOUSE
            <small>Fresh Donuts Every Day</small>
        </div>

        <button class="cart-button" onclick="showPage('cart')">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <nav class="nav">
        <button class="active" data-page="home" onclick="showPage('home')">
            🍩 Menu
        </button>
        <button data-page="cart" onclick="showPage('cart')">
            🛒 Keranjang (<span id="navCartCount">0</span>)
        </button>
        <button data-page="history" onclick="showPage('history')">
            📋 Riwayat
        </button>
    </nav>

    <main class="content" id="content"></main>

    <div class="mobile-cart-bar" id="mobileCartBar" onclick="showPage('cart')">
        <div>
            <b id="mobileCartInfo">0 item • Rp 0</b>
        </div>
        <button type="button">Lihat Keranjang</button>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================
   STORE CONFIG & PRODUCT DATA
========================= */

const STORE_WHATSAPP = "6281234567890"; // Ganti dengan nomor WA toko (format 62...)

const defaultProducts = [
    {
        id: 1,
        name: "Chocolate Donut",
        price: 12000,
        stock: 20,
        desc: "Donat cokelat premium",
        image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500"
    },
    {
        id: 2,
        name: "Strawberry Donut",
        price: 13000,
        stock: 15,
        desc: "Donat strawberry glaze",
        image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500"
    },
    {
        id: 3,
        name: "Vanilla Donut",
        price: 11000,
        stock: 18,
        desc: "Donat vanilla cream",
        image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500"
    },
    {
        id: 4,
        name: "Matcha Donut",
        price: 15000,
        stock: 10,
        desc: "Donat matcha Jepang",
        image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500"
    },
    {
        id: 5,
        name: "Cheese Donut",
        price: 14000,
        stock: 12,
        desc: "Donat topping keju",
        image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500"
    },
    {
        id: 6,
        name: "Oreo Donut",
        price: 15000,
        stock: 8,
        desc: "Donat topping Oreo",
        image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500"
    }
];

/* =========================
   LOCAL STORAGE
========================= */

let products = JSON.parse(localStorage.getItem("donut_products"));
if (!Array.isArray(products) || !products.length) {
    products = structuredClone(defaultProducts);
}

let cart = JSON.parse(localStorage.getItem("donut_cart")) || [];
let orders = JSON.parse(localStorage.getItem("donut_orders")) || [];

let currentPage = "home";
let historyPage = 1;
const perPage = 5;
let searchKeyword = "";
let toastTimer = null;

function saveData() {
    localStorage.setItem("donut_products", JSON.stringify(products));
    localStorage.setItem("donut_cart", JSON.stringify(cart));
    localStorage.setItem("donut_orders", JSON.stringify(orders));
}

function showToast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        el.classList.remove("show");
    }, 2000);
}

function rupiah(value) {
    return "Rp " + Number(value || 0).toLocaleString("id-ID");
}

function formatDate(value) {
    return new Date(value).toLocaleString("id-ID");
}

function getProduct(id) {
    return products.find(p => p.id === id);
}

function getCartQty(id) {
    const found = cart.find(x => x.id === id);
    return found ? found.qty : 0;
}

/* =========================
   NAVIGATION
========================= */

function showPage(page) {
    currentPage = page;

    document.querySelectorAll(".nav button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
    });

    if (page === "home") renderProducts();
    if (page === "cart") renderCart();
    if (page === "history") renderHistory();
}

/* =========================
   PRODUCT CATALOG
========================= */

function renderStockBadge(stock) {
    if (stock <= 0) {
        return `<span class="stock-badge out">Habis</span>`;
    }
    if (stock <= 5) {
        return `<span class="stock-badge low">Sisa ${stock}</span>`;
    }
    return `<span class="stock-badge">Stok: ${stock}</span>`;
}

function renderProducts() {
    document.getElementById("content").innerHTML = `
        <h2 class="page-title">Our Donuts 🍩</h2>
        <p class="subtitle">Pilih donat favoritmu dan atur jumlah pesanan.</p>

        <div class="products">
            ${products.map(p => {
                const inCart = getCartQty(p.id);
                const outOfStock = p.stock <= 0;

                return `
                    <div class="product">
                        <img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.name)}">
                        <div class="product-info">
                            <h3>${escapeHTML(p.name)}</h3>
                            <p>${escapeHTML(p.desc)}</p>
                            ${renderStockBadge(p.stock)}
                            <div class="price">${rupiah(p.price)}</div>

                            ${outOfStock ? `
                                <button class="btn" disabled>Stok Habis</button>
                            ` : inCart > 0 ? `
                                <div class="card-qty-row">
                                    <button type="button" onclick="changeQty(${p.id}, -1, 'home')">−</button>
                                    <span>${inCart} di keranjang</span>
                                    <button type="button" onclick="changeQty(${p.id}, 1, 'home')">+</button>
                                </div>
                            ` : `
                                <button type="button" class="btn" onclick="addCart(${p.id})">+ Tambah</button>
                            `}
                        </div>
                    </div>
                `;
            }).join("")}
        </div>
    `;
}

/* =========================
   CART & STOCK VALIDATION
========================= */

function addCart(id) {
    const product = getProduct(id);
    if (!product || product.stock <= 0) {
        showToast("Stok donat sedang habis.");
        return;
    }

    const item = cart.find(x => x.id === id);
    const currentQty = item ? item.qty : 0;

    if (currentQty + 1 > product.stock) {
        showToast(`Maksimal ${product.stock} pcs sesuai stok.`);
        return;
    }

    if (item) {
        item.qty++;
    } else {
        cart.push({ id, qty: 1 });
    }

    saveData();
    updateCartCount();
    showToast(`${product.name} ditambahkan ke keranjang`);

    if (currentPage === "home") renderProducts();
}

function changeQty(id, change, source = "cart") {
    const product = getProduct(id);
    const item = cart.find(x => x.id === id);
    if (!product || !item) return;

    const nextQty = item.qty + change;

    if (nextQty > product.stock) {
        showToast(`Stok tersedia hanya ${product.stock} pcs.`);
        return;
    }

    if (nextQty <= 0) {
        cart = cart.filter(x => x.id !== id);
    } else {
        item.qty = nextQty;
    }

    saveData();
    updateCartCount();

    if (source === "home") renderProducts();
    if (source === "cart") renderCart();
}

function removeCart(id) {
    cart = cart.filter(x => x.id !== id);
    saveData();
    updateCartCount();
    renderCart();
}

function updateCartCount() {
    const count = cart.reduce((sum, item) => sum + item.qty, 0);
    const subtotal = cartSubtotal();

    document.getElementById("cartCount").textContent = count;
    document.getElementById("navCartCount").textContent = count;
    document.getElementById("mobileCartInfo").textContent = `${count} item • ${rupiah(subtotal)}`;
}

function cartSubtotal() {
    return cart.reduce((sum, item) => {
        const product = getProduct(item.id);
        return sum + (product ? product.price * item.qty : 0);
    }, 0);
}

function renderCart() {
    let html = `
        <h2 class="page-title">Keranjang Pesanan</h2>
        <p class="subtitle">Atur qty pesanan sebelum checkout.</p>
        <div class="panel">
    `;

    if (!cart.length) {
        html += `<div class="empty">Keranjang masih kosong 🍩</div>`;
    } else {
        cart.forEach(item => {
            const p = getProduct(item.id);
            if (!p) return;

            html += `
                <div class="cart-item">
                    <div>
                        <b>${escapeHTML(p.name)}</b><br>
                        <small>${rupiah(p.price)} • Maks. stok ${p.stock}</small>
                    </div>
                    <div class="qty">
                        <button type="button" onclick="changeQty(${p.id}, -1, 'cart')">−</button>
                        <span>${item.qty}</span>
                        <button type="button" onclick="changeQty(${p.id}, 1, 'cart')">+</button>
                        <button type="button" class="remove" onclick="removeCart(${p.id})">×</button>
                    </div>
                </div>
            `;
        });

        html += `
            <div class="total">
                <span>Subtotal</span>
                <span>${rupiah(cartSubtotal())}</span>
            </div>
            <button type="button" class="btn" onclick="renderCheckout()">Lanjut Checkout</button>
        `;
    }

    html += `</div>`;
    document.getElementById("content").innerHTML = html;
}

/* =========================
   CHECKOUT & WHATSAPP ORDER LINK
========================= */

function renderCheckout() {
    if (!cart.length) {
        showToast("Keranjang masih kosong!");
        showPage("cart");
        return;
    }

    document.getElementById("content").innerHTML = `
        <h2 class="page-title">Checkout</h2>
        <p class="subtitle">Lengkapi informasi pemesanan.</p>

        <div class="panel">
            <div class="form-group">
                <label>Nama Pelanggan</label>
                <input id="customer" placeholder="Nama lengkap">
            </div>

            <div class="form-group">
                <label>No. WhatsApp</label>
                <input id="phone" type="tel" placeholder="08xxxxxxxxxx">
            </div>

            <div class="form-group">
                <label>Jenis Pesanan</label>
                <select id="orderType" onchange="toggleOrderType()">
                    <option value="Makan di Tempat">Makan di Tempat</option>
                    <option value="Take Away">Take Away</option>
                    <option value="Request PO">Request PO</option>
                </select>
            </div>

            <div id="takeawayFields" style="display:none">
                <div class="form-group">
                    <label>Alamat Pengantaran / Pengambilan</label>
                    <input id="address" placeholder="Alamat lengkap">
                </div>
                <div class="form-group">
                    <label>Biaya Ongkir (Rp)</label>
                    <input id="shipping" type="number" min="0" value="0">
                </div>
            </div>

            <div id="poFields" style="display:none">
                <div class="form-group">
                    <label>Nomor PO</label>
                    <input id="poNumber" placeholder="PO-0001">
                </div>
                <div class="form-group">
                    <label>Tanggal PO</label>
                    <input id="poDate" type="date">
                </div>
            </div>

            <div class="form-group">
                <label>Catatan Pesanan</label>
                <input id="notes" placeholder="Catatan tambahan">
            </div>

            <div class="total">
                <span>Total Donat</span>
                <span>${rupiah(cartSubtotal())}</span>
            </div>

            <div class="total">
                <span>Biaya Ongkir</span>
                <span id="shippingDisplay">${rupiah(0)}</span>
            </div>

            <div class="total">
                <span>Total Pembayaran</span>
                <span id="grandTotal">${rupiah(cartSubtotal())}</span>
            </div>

            <button type="button" class="btn" onclick="submitOrder(false)">
                Konfirmasi Pesanan
            </button>

            <button type="button" class="btn btn-wa" style="margin-top:10px" onclick="submitOrder(true)">
                💬 Konfirmasi & Kirim ke WhatsApp
            </button>

            <button type="button" class="btn btn-secondary" style="margin-top:10px" onclick="showPage('cart')">
                Kembali ke Keranjang
            </button>
        </div>
    `;

    document.getElementById("shipping").addEventListener("input", updateCheckoutTotal);
}

function toggleOrderType() {
    const type = document.getElementById("orderType").value;
    document.getElementById("takeawayFields").style.display = type === "Take Away" ? "block" : "none";
    document.getElementById("poFields").style.display = type === "Request PO" ? "block" : "none";
    updateCheckoutTotal();
}

function updateCheckoutTotal() {
    const type = document.getElementById("orderType").value;
    const shipping = type === "Take Away"
        ? Math.max(0, Number(document.getElementById("shipping").value) || 0)
        : 0;

    document.getElementById("shippingDisplay").textContent = rupiah(shipping);
    document.getElementById("grandTotal").textContent = rupiah(cartSubtotal() + shipping);
}

function buildWhatsAppOrderUrl(order) {
    const lines = [
        `Halo *Donut House*, saya ingin konfirmasi pesanan:`,
        `Invoice: *${order.id}*`,
        `Nama: ${order.customer} (${order.phone})`,
        `Tipe: ${order.type}`,
        ...(order.address ? [`Alamat: ${order.address}`] : []),
        ...(order.poNumber ? [`No. PO: ${order.poNumber} (${order.poDate})`] : []),
        ``,
        `*Rincian Item:*`,
        ...order.items.map(i => `• ${i.name} x${i.qty} = ${rupiah(i.price * i.qty)}`),
        ``,
        `Subtotal: ${rupiah(order.subtotal)}`,
        `Ongkir: ${rupiah(order.shipping)}`,
        `*Total: ${rupiah(order.total)}*`,
        ...(order.notes ? [`Catatan: ${order.notes}`] : [])
    ];

    return `https://wa.me/${STORE_WHATSAPP}?text=${encodeURIComponent(lines.join("\n"))}`;
}

/* =========================
   SAVE ORDER & REDUCE STOCK
========================= */

function submitOrder(openWhatsApp = false) {
    if (!cart.length) {
        showToast("Keranjang kosong!");
        return;
    }

    // Validasi ketersediaan stok sebelum mengurangi qty
    for (const item of cart) {
        const product = getProduct(item.id);
        if (!product || item.qty > product.stock) {
            showToast(`Stok ${product ? product.name : "produk"} tidak mencukupi!`);
            return;
        }
    }

    const customer = document.getElementById("customer").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const type = document.getElementById("orderType").value;

    const shipping = type === "Take Away"
        ? Math.max(0, Number(document.getElementById("shipping").value) || 0)
        : 0;

    if (!customer || !phone) {
        showToast("Nama dan nomor WhatsApp wajib diisi!");
        return;
    }

    const address = type === "Take Away"
        ? document.getElementById("address").value.trim()
        : "";

    if (type === "Take Away" && !address) {
        showToast("Alamat pengambilan/pengantaran wajib diisi!");
        return;
    }

    const poNumber = type === "Request PO"
        ? document.getElementById("poNumber").value.trim()
        : "";

    const poDate = type === "Request PO"
        ? document.getElementById("poDate").value
        : "";

    if (type === "Request PO" && (!poNumber || !poDate)) {
        showToast("Nomor PO dan tanggal PO wajib diisi!");
        return;
    }

    const items = cart.map(item => {
        const p = getProduct(item.id);
        // Kurangi stok produk sesuai qty yang dipesan
        p.stock = Math.max(0, p.stock - item.qty);

        return {
            id: p.id,
            name: p.name,
            price: p.price,
            qty: item.qty
        };
    });

    const subtotal = cartSubtotal();
    const initialStatus = type === "Makan di Tempat" ? "Selesai" : "Pending";

    const order = {
        id: "INV-" + Date.now(),
        date: new Date().toISOString(),
        customer,
        phone,
        type,
        address,
        shipping,
        poNumber,
        poDate,
        notes: document.getElementById("notes").value.trim(),
        items,
        subtotal,
        total: subtotal + shipping,
        status: initialStatus
    };

    orders.unshift(order);
    cart = [];

    saveData();
    updateCartCount();
    showToast("Pesanan tersimpan & stok diperbarui!");

    if (openWhatsApp) {
        window.open(buildWhatsAppOrderUrl(order), "_blank", "noopener,noreferrer");
    }

    showPage("history");
}

/* =========================
   ORDER HISTORY
========================= */

function renderHistory() {
    historyPage = 1;
    searchKeyword = "";

    document.getElementById("content").innerHTML = `
        <h2 class="page-title">Riwayat Pemesanan</h2>
        <p class="subtitle">Daftar seluruh transaksi pemesanan donat.</p>

        <div class="toolbar">
            <input id="searchOrder" placeholder="Cari nomor order / pelanggan..." oninput="searchHistory(this.value)">
            <select id="statusFilter" onchange="filterHistory()">
                <option value="">Semua Status</option>
                <option>Pending</option>
                <option>Diproses</option>
                <option>Selesai</option>
                <option>Dibatalkan</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>No. Invoice</th>
                        <th>Pelanggan</th>
                        <th>Jenis</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>

        <div class="pagination" id="pagination"></div>
    `;

    renderHistoryRows();
}

function getFilteredOrders() {
    const keyword = searchKeyword.toLowerCase();
    const status = document.getElementById("statusFilter")?.value || "";

    return orders.filter(o => {
        const matchSearch =
            o.id.toLowerCase().includes(keyword) ||
            o.customer.toLowerCase().includes(keyword) ||
            o.phone.toLowerCase().includes(keyword);

        const matchStatus = !status || o.status === status;
        return matchSearch && matchStatus;
    });
}

function searchHistory(value) {
    searchKeyword = value;
    historyPage = 1;
    renderHistoryRows();
}

function filterHistory() {
    historyPage = 1;
    renderHistoryRows();
}

function renderHistoryRows() {
    const filtered = getFilteredOrders();
    const totalPages = Math.ceil(filtered.length / perPage);

    if (totalPages && historyPage > totalPages) {
        historyPage = totalPages;
    }

    const start = (historyPage - 1) * perPage;
    const data = filtered.slice(start, start + perPage);
    const tbody = document.getElementById("historyBody");

    if (!data.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="empty">Belum ada data pemesanan.</td>
            </tr>
        `;
    } else {
        tbody.innerHTML = data.map(o => `
            <tr>
                <td><b>${escapeHTML(o.id)}</b></td>
                <td>${escapeHTML(o.customer)}</td>
                <td>${escapeHTML(o.type)}</td>
                <td>${rupiah(o.total)}</td>
                <td><span class="status ${o.status}">${escapeHTML(o.status)}</span></td>
                <td>
                    <button type="button" onclick="viewOrder('${o.id}')">Detail / Invoice</button>
                </td>
            </tr>
        `).join("");
    }

    let pagination = "";
    for (let i = 1; i <= totalPages; i++) {
        pagination += `
            <button type="button" class="${i === historyPage ? "active" : ""}" onclick="changePage(${i})">
                ${i}
            </button>
        `;
    }

    document.getElementById("pagination").innerHTML = pagination;
}

function changePage(page) {
    historyPage = page;
    renderHistoryRows();
}

   ORDER DETAIL + INVOICE
========================= */

    const isTakeAway = o.type === "Take Away";
    const isPO = o.type === "Request PO";

    document.getElementById("content").innerHTML = `
        <h2 class="page-title">Invoice Pesanan</h2>
        <p class="subtitle">Detail transaksi dan bukti pemesanan.</p>

        <div class="invoice">
            <div class="invoice-header">
                <div>
                    <h2>🍩 DONUT HOUSE</h2>
                    <p>Fresh Donuts Every Day</p>
                    <p>Thank you for your order!</p>
                </div>
                <div style="text-align:right">
                    <h2>INVOICE</h2>
                    <p>${escapeHTML(o.id)}</p>
                    <p>${formatDate(o.date)}</p>
                </div>
            </div>

                <div class="invoice-info">
                    <div>
                        <small>DITAGIHKAN KEPADA</small>

                        <p>${escapeHTML(o.phone)}</p>
                    </div>
                    <div>
                        <small>INFORMASI PESANAN</small>
                        <b>${escapeHTML(o.type)}</b>
                        <p>${formatDate(o.date)}</p>
                        ${o.address ? `<p>Alamat: ${escapeHTML(o.address)}</p>` : ""}
                        ${o.poNumber ? `<p>No. PO: ${escapeHTML(o.poNumber)}</p>` : ""}
                        ${o.poDate ? `<p>Tanggal PO: ${escapeHTML(o.poDate)}</p>` : ""}
                    </div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
                    <b>Rincian Pesanan</b>
                    <span class="status ${o.status}">${escapeHTML(o.status)}</span>
                </div>

                <div class="table-wrap">
                    <table class="invoice-table">
                        <thead>
                            <tr>
                                <th>Produk</th>
                                <th>Harga</th>
                                <th>Qty</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${o.items.map(i => `
                                <tr>
                                    <td>${escapeHTML(i.name)}</td>
                                    <td>${rupiah(i.price)}</td>
                                    <td>${i.qty}</td>
                                    <td><b>${rupiah(i.price * i.qty)}</b></td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>

                <div class="invoice-summary">
                    <div>
                        <span>Subtotal</span>
                        <span>${rupiah(o.subtotal)}</span>
                    </div>
                    <div>
                        <span>Ongkos Kirim</span>
                        <span>${rupiah(o.shipping)}</span>
                    </div>
                    <div class="grand">
                        <span>TOTAL</span>
                        <span>${rupiah(o.total)}</span>
                    </div>
                </div>

                <hr style="margin:25px 0;border:0;border-top:1px solid #eee">

                <p style="font-size:13px;color:#777">
                    <b>Catatan:</b> ${escapeHTML(o.notes || "-")}
                </p>

                ${isTakeAway && o.status !== "Selesai" && o.status !== "Dibatalkan" ? `
                    <div class="pickup-notice">
                        <b>📦 Menunggu Pengambilan</b>
                        <p>Pesanan belum dikonfirmasi telah diambil pelanggan.</p>
                        <button type="button" class="btn btn-success" onclick="confirmPickup('${o.id}')">
                            ✓ Konfirmasi Sudah Diambil
                        </button>
                    </div>
                ` : ""}

                ${isTakeAway && o.status === "Selesai" ? `
                    <div style="margin-top:20px;padding:15px;background:#dcfce7;border-radius:9px;color:#15803d">
                        <b>✓ Pesanan Sudah Diambil</b>
                        <p style="font-size:12px;margin-top:7px">
                            ${o.pickedUpAt ? "Dikonfirmasi pada " + formatDate(o.pickedUpAt) : "Pesanan telah dinyatakan selesai."}
                        </p>
                    </div>
                ` : ""}

                ${isPO ? `
                    <div style="margin-top:20px">
                        <div class="form-group">
                            <label>Update Status PO</label>
                            <select id="updateStatus">
                                ${["Pending","Diproses","Selesai","Dibatalkan"].map(s => `
                                    <option value="${s}" ${o.status === s ? "selected" : ""}>${s}</option>
                                `).join("")}
                            </select>
                        </div>
                        <button type="button" class="btn" onclick="updateOrderStatus('${o.id}')">
                            Simpan Status
                        </button>
                    </div>

            <div class="invoice-footer">

        <div class="invoice-actions">

}

function shareOrderWhatsApp(id) {
    const order = orders.find(o => o.id === id);
    if (!order) return;
    window.open(buildWhatsAppOrderUrl(order), "_blank", "noopener,noreferrer");
}

function confirmPickup(id) {
    const order = orders.find(o => o.id === id);
    if (!order || order.type !== "Take Away") return;
    if (order.status === "Selesai" || order.status === "Dibatalkan") return;
    if (!confirm("Apakah pelanggan sudah mengambil pesanannya?")) return;

    order.status = "Selesai";
    order.pickedUpAt = new Date().toISOString();
    saveData();
    showToast("Pengambilan dikonfirmasi!");
    viewOrder(id);
}

function updateOrderStatus(id) {
    const order = orders.find(o => o.id === id);
    if (!order || order.type !== "Request PO") return;

    const nextStatus = document.getElementById("updateStatus").value;
    const prevStatus = order.status;

    // Jika dibatalkan dari status aktif, kembalikan stok ke produk
    if (nextStatus === "Dibatalkan" && prevStatus !== "Dibatalkan") {
        order.items.forEach(item => {
            const p = getProduct(item.id);
            if (p) p.stock += item.qty;
        });
    }

    order.status = nextStatus;
    saveData();
    showToast("Status berhasil diperbarui!");
    viewOrder(id);
}

/* =========================
   HTML ESCAPE & INIT
========================= */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

updateCartCount();
showPage("home");

</script>
